# 🧮 Site Configuration - FeathersUp Podcast
# ---------------------------------------------------------
# 注意：YAML 对空格极其敏感，请确保直接复制，不要手动修改缩进。

# 1. 网站核心设置
name: "FeathersUp Podcast"
title: "FeathersUp Podcast"
description: "关于创业、艺术与学术的对话。由 lailudan 策划。即将赴日攻读经济学博士。"
logo: 
favicon: 'assets/images/logo.png'

# 🚀 路径修正 (修复网站变丑的关键)
url: "https://lailudan.github.io"
baseurl: "/FeathersUp_Podcast"

# 2. 功能开关
google_analytics: ''
disqus: ''
mailchimp-list: ''
include: ["_pages"]
permalink: /:title/

# 3. ✍️ 作者信息 (已更新为你的背景)
authors:
  lailudan:
    name: lailudan
    display_name: lailudan
    avatar: 'assets/images/avatar.png'
    web: https://lailudan.github.io/FeathersUp_Podcast/
    description: "FeathersUp Podcast 制作人。建筑学背景，现于神户大学攻读博士，关注 HEOR 与经济学领域。热爱分形几何、钢笔与跨界对话。"

# 4. 🛠️ 插件列表 (保持现状以支持功能)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-archives
    
# 5. 分类归档设置
jekyll-archives:
  enabled:
    - categories
  layout: archive
  permalinks:
    category: '/category/:name/'
    
# 6. 分页设置 (每页显示 6 篇文章)
paginate: 6
paginate_path: /page:num/
    
# 7. 技术渲染配置
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

# 8. 其他设置
adsense: "disabled"
lazyimages: "enabled"

# 9. 排除文件 (不参与网页生成的开发文件)
exclude: [changelog.md, LICENSE.txt, README.md, Gemfile, Gemfile.lock]
