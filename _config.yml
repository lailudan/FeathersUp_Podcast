# 🧮 Site Configuration - FeathersUp Podcast
name: "FeathersUp Podcast"
title: "FeathersUp Podcast"
description: "关于创业、艺术与学术的对话。由 lailudan 策划。"
logo: 'assets/images/logo.png'
favicon: 'assets/images/logo.png'

# 🚀 这里的 baseurl 必须改，否则样式会乱
url: "https://lailudan.github.io"
baseurl: "/FeathersUp_Podcast"

google_analytics: ''
disqus: ''
mailchimp-list: ''
include: ["_pages"]
permalink: /:title/

# 🎨 Authors - 这里改成了你的信息
authors:
  lailudan:
    name: lailudan
    display_name: lailudan
    avatar: 'assets/images/avatar.png' # 建议稍后在 assets/images/ 换成你的头像
    email: # 选填
    web: https://lailudan.github.io/FeathersUp_Podcast/
    twitter: 
    description: "FeathersUp Podcast 主理人。建筑师、播客制作人，正在探索分形几何与经济学的交界。"

# 🛠️ Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-archives
    
# Archives
jekyll-archives:
  enabled:
    - categories
  layout: archive
  permalinks:
    category: '/category/:name/'
    
# Pagination 
paginate: 6
paginate_path: /page:num/
    
# Other
markdown: kramdown

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

# Adsense 
adsense: "disabled"

# Lazy Images
lazyimages: "enabled"

exclude: [changelog.md, LICENSE.txt, README.md, Gemfile, Gemfile.lock]
